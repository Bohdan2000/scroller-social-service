services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: social_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-social}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-social_secret}
      POSTGRES_DB: ${POSTGRES_DB:-social_service}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-social} -d ${POSTGRES_DB:-social_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Social Service ──────────────────────────────────────────────────────────
  social:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: social_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3002}
      DATABASE_URL: postgresql://${POSTGRES_USER:-social}:${POSTGRES_PASSWORD:-social_secret}@postgres:5432/${POSTGRES_DB:-social_service}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "${PORT:-3002}:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/api/v1/health 2>/dev/null || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
