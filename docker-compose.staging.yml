networks:
  scroller-net:
    external: true

services:
  social:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: social_service
    restart: unless-stopped
    env_file: .env.staging
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://social:social_secret@postgres:5432/social_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3002:3002"
    networks:
      - scroller-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/api/v1/health 2>/dev/null || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
